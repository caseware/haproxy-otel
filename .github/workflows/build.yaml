name: Build Module

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: 'Whether to upload artifacts'
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build - ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: libhaproxy_otel_module.so
            release_name: libhaproxy_otel_module-linux-x86_64.so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: libhaproxy_otel_module.so
            release_name: libhaproxy_otel_module-linux-aarch64.so
            cross: true
          # macOS builds
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: libhaproxy_otel_module.dylib
            release_name: libhaproxy_otel_module-macos-x86_64.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: libhaproxy_otel_module.dylib
            release_name: libhaproxy_otel_module-macos-aarch64.dylib
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
      
      - name: Build release
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p haproxy-otel-module
          else
            cargo build --release --target ${{ matrix.target }} -p haproxy-otel-module
          fi
        shell: bash
      
      - name: Strip binary (Linux/macOS)
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }} || true
        shell: bash
      
      - name: Rename artifact
        run: |
          mkdir -p release-artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release-artifacts/${{ matrix.release_name }}
        shell: bash
      
      - name: Upload artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_name }}
          path: release-artifacts/${{ matrix.release_name }}
          if-no-files-found: error
