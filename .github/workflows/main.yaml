name: CI
on: [push, pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Test and Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - run tests here
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run_tests: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          # macOS builds
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install HAProxy (Ubuntu only)
        if: matrix.run_tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends software-properties-common
          sudo add-apt-repository ppa:vbernat/haproxy-3.2 -y
          sudo apt-get install haproxy=3.2.\*
        shell: bash
      
      - name: Run tests
        if: matrix.run_tests
        run: |
          cargo test -p haproxy-otel-tests
        shell: bash
      
      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
      
      - name: Build module
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p haproxy-otel-module
          else
            cargo build --release --target ${{ matrix.target }} -p haproxy-otel-module
          fi
        shell: bash
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: haproxy-otel-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libhaproxy_otel_module.*
          if-no-files-found: error

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: giraffate/clippy-action@v1
        with:
          reporter: 'github-pr-review'
