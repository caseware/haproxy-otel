name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release
    uses: ./.github/workflows/build.yaml
    with:
      upload-artifacts: true

  create-release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      
      - name: Display structure of downloaded files
        run: ls -R release-artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Installation
            
            Download the appropriate library for your platform:
            - Linux x86_64: `libhaproxy_otel_module-linux-x86_64.so`
            - Linux ARM64: `libhaproxy_otel_module-linux-aarch64.so`
            - macOS x86_64: `libhaproxy_otel_module-macos-x86_64.dylib`
            - macOS ARM64: `libhaproxy_otel_module-macos-aarch64.dylib`
            
            ## Usage
            
            Place the downloaded library in a location accessible to HAProxy and reference it in your Lua script.
            See the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md) for configuration details.
          files: |
            release-artifacts/**/*

  publish-crate:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'caseware'
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_TOKEN }}
        continue-on-error: true
