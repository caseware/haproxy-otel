name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release - ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: libhaproxy_otel_module.so
            release_name: libhaproxy_otel_module-linux-x86_64.so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: libhaproxy_otel_module.so
            release_name: libhaproxy_otel_module-linux-aarch64.so
            cross: true
          # macOS builds
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: libhaproxy_otel_module.dylib
            release_name: libhaproxy_otel_module-macos-x86_64.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: libhaproxy_otel_module.dylib
            release_name: libhaproxy_otel_module-macos-aarch64.dylib
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
      
      - name: Build release
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p haproxy-otel-module
          else
            cargo build --release --target ${{ matrix.target }} -p haproxy-otel-module
          fi
        shell: bash
      
      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }} || true
        shell: bash
      
      - name: Prepare artifact
        run: |
          mkdir -p release-artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release-artifacts/${{ matrix.release_name }}
        shell: bash
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_name }}
          path: release-artifacts/${{ matrix.release_name }}
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      
      - name: Display structure of downloaded files
        run: ls -R release-artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Installation
            
            Download the appropriate library for your platform:
            - Linux x86_64: `libhaproxy_otel_module-linux-x86_64.so`
            - Linux ARM64: `libhaproxy_otel_module-linux-aarch64.so`
            - macOS x86_64: `libhaproxy_otel_module-macos-x86_64.dylib`
            - macOS ARM64: `libhaproxy_otel_module-macos-aarch64.dylib`
            
            ## Usage
            
            Place the downloaded library in a location accessible to HAProxy and reference it in your Lua script.
            See the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md) for configuration details.
          files: |
            release-artifacts/*/*

  publish-crate:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'caseware'
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_TOKEN }}
        continue-on-error: true
