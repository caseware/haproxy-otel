global
    master-worker
    insecure-fork-wanted
    lua-prepend-path "../target/release/lib?.dylib" cpath
    lua-prepend-path "../target/release/lib?.so" cpath
    tune.lua.bool-sample-conversion normal
    lua-load-per-thread haproxy-with-headers.lua

defaults
    mode http
    timeout connect 100ms
    timeout client 1s
    timeout server 1s

frontend http-in
    bind *:8081
    http-request lua.start_server_span
    filter lua.opentelemetry-trace
    use_backend status if { path /status }
    default_backend default

backend status
    http-request return status 200

backend default
    server srv1 127.0.0.1:4318
